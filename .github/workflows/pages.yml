name: deploy-pages
on:
  push:
    branches: [main]
  schedule:
    # offset to :03/:08/... — GitHub docs warn schedules slip or drop under
    # load, worst at the top of the hour, so avoid :00. Backed by the
    # browser live-upgrade + external cron-job.org → workflow_dispatch option.
    - cron: '3/5 * * * *' # refresh realtime snapshot; board counts down client-side between deploys
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs || echo 'fetch failed, deploying with last snapshot'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
